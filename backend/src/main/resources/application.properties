spring.application.name=backend
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=reservasScouts;encrypt=true;trustServerCertificate=true
spring.datasource.username=reservas_app
spring.datasource.password=${RESERVASSCOUTS_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.backup.directory=${RESERVASSCOUTS_BACKUP_DIRECTORY:C:/Program Files/Microsoft SQL Server/MSSQL17.MSSQLSERVER/MSSQL/Backup}